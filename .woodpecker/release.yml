labels:
  platform: linux/amd64
when:
  - event: push
    branch: main
steps:
  - name: github-release
    image: node:22.22.2-bookworm-slim
    environment:
      GITHUB_API_TOKEN:
        from_secret: personal_access_tokens_fine_grained_tokens_jurislm
    commands:
      - |
        set -eu
        repo_url="$(node scripts/release-pr-auto-merge.mjs --repository-url)"
        npx --yes release-please@17.10.4 github-release --token="$GITHUB_API_TOKEN" --repo-url="$repo_url" --target-branch=main --config-file=release-please-config.json --manifest-file=.release-please-manifest.json
  - name: release-pr
    image: node:22.22.2-bookworm-slim
    depends_on:
      - github-release
    environment:
      GITHUB_API_TOKEN:
        from_secret: personal_access_tokens_fine_grained_tokens_jurislm
    commands:
      - |
        set -eu
        repo_url="$(node scripts/release-pr-auto-merge.mjs --repository-url)"
        npx --yes release-please@17.10.4 release-pr --token="$GITHUB_API_TOKEN" --repo-url="$repo_url" --target-branch=main --config-file=release-please-config.json --manifest-file=.release-please-manifest.json
